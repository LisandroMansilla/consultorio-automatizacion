name: Verify documented metrics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sha256sum -c SHA256SUMS.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/metricas.py recursos metrics/recursos.template.csv
      - run: python tools/metricas.py operacion metrics/operacion.template.json
